<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07101d"><title>ChattinHub 3D Racing</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:system-ui,Arial;touch-action:none}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:10px;gap:8px}.glass{background:#071426d9;border:1px solid #6b88a6aa;border-radius:12px;padding:8px 11px;backdrop-filter:blur(10px);font-weight:800;text-shadow:0 2px 5px #000}.muted{font-size:10px;letter-spacing:1.5px;color:#9eb7d2}.value{font-size:19px}.bottom{position:absolute;bottom:max(15px,env(safe-area-inset-bottom));left:0;right:0;padding:0 14px;display:flex;align-items:end;justify-content:space-between;pointer-events:auto}.group{display:flex;gap:8px;align-items:end}.ctrl{width:60px;height:60px;border:1px solid #8ca6c7aa;border-radius:18px;background:#071426cc;color:#fff;font-size:22px;font-weight:900;touch-action:none;user-select:none}.ctrl.active,.ctrl:active{background:#087e9c;border-color:#6ef6ff}.ctrl.go{width:70px;height:76px;border-radius:24px;background:linear-gradient(145deg,#1be1ef,#2c62db);color:#06101d;font-size:16px}.ctrl.nitro{color:#ffe07a;font-size:14px}.btn{pointer-events:auto;border:1px solid #5c7b9e;background:#10213a;color:#fff;padding:11px 14px;border-radius:12px;font-weight:800}.menu{pointer-events:auto;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#06101d55,#06101de8)}.card{width:min(440px,100%);max-height:90vh;overflow:auto;text-align:center;padding:23px;border-radius:25px;background:#09162bf0;border:1px solid #52718f;box-shadow:0 20px 70px #0009}.brand{font-size:11px;letter-spacing:4px;color:#5af4ff;font-weight:900}.title{font-size:clamp(32px,9vw,47px);font-weight:1000;line-height:1;margin:10px 0}.title span{color:#ff4f90}.desc{color:#b5c6db;font-size:14px;line-height:1.5}.main{width:100%;padding:15px;border:0;border-radius:14px;margin-top:10px;background:linear-gradient(90deg,#53eff6,#7d8dff);font-size:16px;font-weight:1000;color:#06101d}.secondary{background:#14243c;color:white;border:1px solid #45617f}.garage{display:flex;gap:8px;margin:12px 0}.carPick{flex:1;padding:10px 4px;border:1px solid #3e5876;border-radius:12px;background:#0a1426;color:white;font-weight:800}.carPick.sel{border-color:#55f4ff;color:#55f4ff}.hidden{display:none!important}#hint{position:absolute;left:50%;top:86px;transform:translateX(-50%);white-space:nowrap;background:#071426df;border:1px solid #5b7898;padding:8px 12px;border-radius:12px;font-size:12px;font-weight:800}#pause{pointer-events:auto;position:absolute;top:80px;right:10px;padding:8px 11px}
</style></head><body><div id="stage"></div><div id="ui"><div class="top"><div class="glass"><div class="muted">SPEED</div><div class="value"><span id="speed">0</span> <small>KM/H</small></div></div><div class="glass"><div class="muted">LAP</div><div class="value"><span id="lap">1</span>/3</div></div><div class="glass"><div class="muted">BEST</div><div class="value"><span id="best">--</span></div></div></div><button class="btn" id="pause">Ⅱ PAUSE</button><div id="hint">Hold GO · steer around the track · use nitro</div><div class="bottom"><div class="group"><button class="ctrl" data-k="left">◀</button><button class="ctrl" data-k="right">▶</button></div><div class="group"><button class="ctrl nitro" data-k="nitro">N₂O</button><button class="ctrl go" data-k="gas">GO</button><button class="ctrl" data-k="brake">▼</button></div></div></div>
<div id="menu" class="menu"><div class="card"><div class="brand">CHATTINHUB PRESENTS</div><div class="title">3D RACING <span>PRO</span></div><p class="desc" id="desc">Race on a 3D circuit, dodge rival cars and use nitro to set your best lap.</p><div class="muted">SELECT YOUR CAR</div><div class="garage"><button class="carPick sel" data-car="0">⚡ CYBER</button><button class="carPick" data-car="1">🔥 PHANTOM</button><button class="carPick" data-car="2">💎 NEON</button></div><button class="main" id="start">START RACE</button><button class="main secondary" id="help">HOW TO PLAY</button><p class="desc" style="font-size:11px">Real-time 3D graphics · touch controls · 3 laps · rivals · nitro</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const root=document.querySelector('#stage');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8cc8e9);scene.fog=new THREE.Fog(0x8cc8e9,55,180);
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdaf4ff,0x34422e,2.0));
const sun=new THREE.DirectionalLight(0xffefce,3.1);sun.position.set(-25,40,18);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;scene.add(sun);
const mat=(color,roughness=.55,metalness=.05)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const grass=mat(0x28764c),asphalt=mat(0x303846,.9),lineMat=mat(0xf3f1e9),red=mat(0xff466e),white=mat(0xeaf5ff),dark=mat(0x111827),glass=mat(0x6ce9ff,.25,.25);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);
const N=220,RX=37,RZ=25;
function trackPoint(t,offset=0){return new THREE.Vector3((RX+offset)*Math.cos(t),0,(RZ+offset)*Math.sin(t))}
function tubeTrack(radiusX,radiusZ,offset,y,material){const pts=[];for(let i=0;i<=N;i++){let a=i/N*Math.PI*2;pts.push(new THREE.Vector3((radiusX+offset)*Math.cos(a),y,(radiusZ+offset)*Math.sin(a)))}const curve=new THREE.CatmullRomCurve3(pts);let mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,N, radius,8,false),material);mesh.receiveShadow=true;scene.add(mesh);return mesh}
function ovalRoad(){const outer=[],inner=[];for(let i=0;i<=N;i++){let a=i/N*Math.PI*2;outer.push(new THREE.Vector3((RX+7)*Math.cos(a),0,(RZ+7)*Math.sin(a)));inner.push(new THREE.Vector3((RX-7)*Math.cos(a),0,(RZ-7)*Math.sin(a)))}const sh=new THREE.Shape();sh.moveTo(outer[0].x,outer[0].z);for(let p of outer.slice(1))sh.lineTo(p.x,p.z);const hole=new THREE.Path();hole.moveTo(inner[0].x,inner[0].z);for(let p of inner.slice(1))hole.lineTo(p.x,p.z);hole.closePath();sh.holes.push(hole);const geo=new THREE.ShapeGeometry(sh,80);const mesh=new THREE.Mesh(geo,asphalt);mesh.rotation.x=-Math.PI/2;mesh.position.y=.015;mesh.receiveShadow=true;scene.add(mesh);
for(let offset of [-7,7]){const pts=[];for(let i=0;i<=N;i++){let a=i/N*Math.PI*2;pts.push(new THREE.Vector3((RX+offset)*Math.cos(a),.08,(RZ+offset*.55)*Math.sin(a)))}const curve=new THREE.CatmullRomCurve3(pts);let m=new THREE.Mesh(new THREE.TubeGeometry(curve,N,.16,6,false),lineMat);scene.add(m)}
// dashed inner lane marker
for(let i=0;i<70;i++){let a=i/70*Math.PI*2, p=new THREE.Mesh(new THREE.BoxGeometry(.22,.035,1.15),lineMat);p.position.set(RX*Math.cos(a),.06,RZ*Math.sin(a));p.rotation.y=-a;p.receiveShadow=true;scene.add(p)}
// start finish stripe
for(let i=0;i<12;i++){let m=new THREE.Mesh(new THREE.BoxGeometry(1.05,.06,.65),i%2?dark:white);m.position.set(RX, .1, -5.5+i*1.0);m.receiveShadow=true;scene.add(m)}
}
ovalRoad();
// Decorative trees and lamps around circuit
for(let i=0;i<76;i++){let a=i/76*Math.PI*2;for(let side of [-1,1]){let x=(RX+side*(10+Math.random()*5))*Math.cos(a),z=(RZ+side*(8+Math.random()*5))*Math.sin(a);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,1.8,6),mat(0x68452b));trunk.position.set(x,.8,z);trunk.castShadow=true;scene.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(1.15,2.8,7),mat(i%3?0x1a8b59:0x2da66b));crown.position.set(x,2.8,z);crown.castShadow=true;scene.add(crown)}}
const carColors=[0x18d8f0,0xff426d,0x9b7bff];
function makeCar(color){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.1,.58,4.05),mat(color,.3,.35));body.position.y=.72;body.castShadow=true;g.add(body);const hood=new THREE.Mesh(new THREE.BoxGeometry(1.8,.18,1.2),mat(color,.25,.25));hood.position.set(0,1.02,-1.15);g.add(hood);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.45,.62,1.65),glass);cabin.position.set(0,1.18,.2);cabin.castShadow=true;g.add(cabin);for(let x of [-1,1])for(let z of [-1.35,1.35]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,14),dark);w.rotation.z=Math.PI/2;w.position.set(x*1.03,.42,z);w.castShadow=true;g.add(w)}for(let x of [-.63,.63]){let lamp=new THREE.Mesh(new THREE.BoxGeometry(.38,.12,.08),mat(0xe7fbff,.2));lamp.position.set(x,.78,-2.04);g.add(lamp);let tail=new THREE.Mesh(new THREE.BoxGeometry(.42,.13,.08),mat(0xff183f));tail.position.set(x,.78,2.04);g.add(tail)}return g}
const player=makeCar(carColors[0]);player.visible=true;player.scale.setScalar(1.18);scene.add(player);
const rivals=[];for(let i=0;i<5;i++){let c=makeCar([0xffb62f,0xf0f3ff,0x45eea1,0xb178ff,0xff527f][i]);scene.add(c);rivals.push({mesh:c,angle:Math.PI*2*(i+1)/6,speed:.15+Math.random()*.09,offset:(i%2?1:-1)*2.5})}
const keys={left:false,right:false,gas:false,brake:false,nitro:false};document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;const down=e=>{e.preventDefault();keys[k]=true;b.classList.add('active')},up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('active')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
addEventListener('keydown',e=>{let map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',' ':'nitro'};if(map[e.key]){keys[map[e.key]]=true;e.preventDefault()}if(e.key==='Escape'||e.key==='p')pause()});addEventListener('keyup',e=>{let map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',' ':'nitro'};if(map[e.key])keys[map[e.key]]=false});
let chosen=0,mode='menu',speed=0,nitro=100,angle=-Math.PI/2,lap=1,best=+(localStorage.ch3d_best||0),lapAngle=0,pausedFrom='play',last=performance.now(),elapsed=0,collideFlash=0;
document.querySelector('#best').textContent=best?best.toFixed(1)+'s':'--';
document.querySelectorAll('[data-car]').forEach(b=>b.onclick=()=>{chosen=+b.dataset.car;document.querySelectorAll('[data-car]').forEach(x=>x.classList.toggle('sel',x===b));player.children[0].material.color.setHex(carColors[chosen])});
function pause(){if(mode==='play'){mode='paused';document.querySelector('#desc').textContent='Race paused. Tap resume when ready.';document.querySelector('#start').textContent='RESUME RACE';document.querySelector('#menu').classList.remove('hidden')}else if(mode==='paused'){mode='play';document.querySelector('#menu').classList.add('hidden');last=performance.now()}}
document.querySelector('#pause').onclick=pause;
document.querySelector('#help').onclick=()=>{document.querySelector('#desc').textContent='Hold GO to accelerate. Steer left/right around the oval. N₂O gives a temporary boost. Finish 3 laps and avoid rival cars.'};
function start(){mode='play';speed=0;nitro=100;angle=-Math.PI/2;lap=1;lapAngle=0;elapsed=0;collideFlash=0;player.visible=true;player.position.set(RX*Math.cos(angle),.08,RZ*Math.sin(angle));player.rotation.y=-angle+Math.PI/2;camera.position.set(player.position.x-Math.cos(angle)*10,5.2,player.position.z-Math.sin(angle)*10);camera.lookAt(player.position.x,1,player.position.z);rivals.forEach((r,i)=>{r.mesh.visible=true;r.angle=(i+1)*Math.PI*2/6;r.speed=.15+Math.random()*.09});document.querySelector('#lap').textContent=lap;document.querySelector('#menu').classList.add('hidden');document.querySelector('#start').textContent='START RACE';last=performance.now()}
document.querySelector('#start').onclick=()=>mode==='paused'?pause():start();
function finish(){mode='over';if(!best||elapsed<best){best=elapsed;localStorage.ch3d_best=best;document.querySelector('#best').textContent=best.toFixed(1)+'s'}document.querySelector('#desc').innerHTML=`FINISH! Time: <b>${elapsed.toFixed(1)} seconds</b><br>Best time: ${best.toFixed(1)} seconds`;document.querySelector('#start').textContent='RACE AGAIN';document.querySelector('#menu').classList.remove('hidden')}
function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-last)/1000,.035);last=now;if(mode==='play'){elapsed+=dt;let boosting=keys.nitro&&nitro>0;let target=keys.gas?1.22:.58;if(keys.brake)target=.28;if(boosting){target+=.7;nitro=Math.max(0,nitro-38*dt)}else nitro=Math.min(100,nitro+10*dt);speed+=(target-speed)*Math.min(1,dt*1.8);if(keys.left)angle+=dt*(.9+speed*.7);if(keys.right)angle-=dt*(.9+speed*.7);let radiusX=RX+Math.sin(angle)*0;player.position.set(RX*Math.cos(angle),.03,RZ*Math.sin(angle));player.rotation.y=-angle+Math.PI/2;player.position.y=.03+Math.abs(Math.sin(now*.012))*Math.min(.035,speed*.02);
let newLap=Math.floor((angle+Math.PI/2+Math.PI*4)/(Math.PI*2)); // fallback lap counter below
lapAngle+=speed*dt*.22;if(lapAngle>Math.PI*2){lapAngle-=Math.PI*2;lap++;document.querySelector('#lap').textContent=Math.min(lap,3);if(lap>3)finish()}
rivals.forEach(r=>{r.angle+=dt*r.speed;let rx=RX+r.offset,rz=RZ+r.offset*.55;r.mesh.position.set(rx*Math.cos(r.angle),0,rz*Math.sin(r.angle));r.mesh.rotation.y=-r.angle+Math.PI/2;let dx=player.position.x-r.mesh.position.x,dz=player.position.z-r.mesh.position.z;if(dx*dx+dz*dz<5){speed*=.72;collideFlash=.25}});
}
const p=player.position;const follow=new THREE.Vector3(p.x-Math.cos(angle)*10,5.2,p.z-Math.sin(angle)*10);camera.position.lerp(follow,.12);camera.lookAt(p.x,1.0,p.z);
document.querySelector('#speed').textContent=Math.round(speed*180);document.querySelector('#hint').style.opacity=mode==='play'?'0.7':'0';renderer.render(scene,camera)}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.setHeaderColor?.('#07101d');Telegram.WebApp.setBackgroundColor?.('#07101d')}
</script></body></html>
