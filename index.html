<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>ChattinHub 3D Racing Pro</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head><body>
<canvas id="c"></canvas><div id="fx"></div>

<div id="loading" class="screen"><h1>ChattinHub<br>3D Racing Pro</h1><div class="bar"><i id="lbar"></i></div><p id="lmsg">Loading…</p><button class="btn hidden" id="retry" onclick="location.reload()">Retry</button></div>

<div id="menu" class="screen hidden"><h1>ChattinHub<br>3D Racing Pro</h1>
<p class="sub">💰 <b id="mcred">0</b> · Best race <b id="mbest">--</b> · Best lap <b id="mlap">--</b> <span id="mdaily"></span></p>
<div class="grid"><button class="btn big span2" data-act="quick">▶ Quick Race</button>
<button class="btn" data-act="champ">🏆 Championship</button><button class="btn" data-act="trial">⏱ Time Trial</button>
<button class="btn" data-act="practice">🔁 Practice</button><button class="btn" data-act="garage">🔧 Garage</button>
<button class="btn sm" data-act="trk" id="btrk"></button><button class="btn sm" data-act="diff" id="bdiff"></button>
<button class="btn sm" data-act="ctl" id="bctl"></button><button class="btn sm" data-act="hap" id="bhap"></button>
<button class="btn sm" data-act="music" id="bmusic"></button><button class="btn sm" data-act="gfx" id="bgfx"></button></div>
<p class="sub">Landscape recommended · hold buttons to drive</p></div>

<div id="garage" class="screen hidden side"><div class="gp">
<div class="row sp"><button class="btn sm" data-act="gback">← Back</button><b id="gcred"></b></div>
<div class="row sp"><button class="btn sm" data-act="gprev">◀</button><h2 id="gname"></h2><button class="btn sm" data-act="gnext">▶</button></div>
<div id="gstats"></div>
<button class="btn big" id="gact" data-act="gsel"></button>
<div id="gcust"></div></div></div>

<div id="hud" class="hidden" data-ctl="0">
<div class="hl"><div id="hpos">P1/4</div><div id="hlap">LAP 1/3</div><div id="htime">0:00.00</div><div id="hbest" class="sm"></div><div id="hdr" class="sm amber"></div></div>
<canvas id="mini" width="128" height="128"></canvas>
<button class="pbtn" data-act="pause">❚❚</button>
<div class="side-btns"><button class="rb" data-act="cam">🎥</button><button class="rb" data-act="respawn">↺</button></div>
<div class="hr"><b id="hspd">0</b><small>km/h</small><div class="nbar"><i id="hnit"></i></div></div>
<div id="hmsg"></div><div id="cd"></div>
<div class="ctl l"><div class="k" data-k="l">◀</div><div class="k" data-k="r">▶</div><div id="pad"><i id="knob"></i></div><div id="tl">⟲ TILT TO STEER ⟳</div></div>
<div class="ctl r"><div class="k dr" data-k="dr">DRIFT</div><div class="k nit" id="knit" data-k="nit">N2O</div><div class="k brk" data-k="brk">BRAKE</div><div class="k gas" data-k="gas">GAS</div></div>
<div id="rot">Rotate your phone to landscape for best racing</div></div>

<div id="pause" class="screen hidden"><h2>Paused</h2><div class="col"><button class="btn big" data-act="resume">Resume</button><button class="btn" data-act="restart">Restart</button><button class="btn" data-act="togarage">Garage</button><button class="btn" data-act="tomenu">Main Menu</button><button class="btn sm" data-act="music" id="bmusic2">Sound</button></div></div>

<div id="results" class="screen hidden"><h1 id="rtitle"></h1><p id="rbody" class="sub"></p><div class="col"><button class="btn big hidden" id="rnext" data-act="next">Next</button><button class="btn big" id="rrestart" data-act="restart">Race Again</button><button class="btn" data-act="togarage">Garage</button><button class="btn" data-act="tomenu">Main Menu</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body></html>
